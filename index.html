<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-capable" content="yes"><title>Мой силовой дневник</title><style>:root{color-scheme:dark;--bg:#101820;--card:#202c36;--field:#14212b;--text:#f5f7fa;--muted:#aab7c4;--blue:#49aeff;--green:#30cd86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding-bottom:100px}header{padding:25px 17px 12px;position:sticky;top:0;background:#101820f5;z-index:2;border-bottom:1px solid #34414a}h1{font-size:23px;margin:0 0 6px}h2{font-size:19px;margin:0 0 13px}.muted,small{color:var(--muted)}main{padding:16px;max-width:650px;margin:auto}.card{background:var(--card);border-radius:15px;padding:15px;margin-bottom:14px}.line{display:flex;align-items:center;gap:8px;justify-content:space-between}.grow{flex:1;min-width:0}.name{font-weight:700}button,input,select{font:inherit;border-radius:10px;border:1px solid #41515e;color:var(--text);background:var(--field);padding:10px;min-width:0}button{cursor:pointer}button.primary{background:#187dba;border-color:#187dba;font-weight:700}button.good{background:#17885c;border-color:#17885c;font-weight:700}button.danger{color:#ff8c92}button.small{padding:7px 10px;font-size:13px}input[type=number]{width:78px;text-align:center}input[type=text]{width:100%}input[type=date]{max-width:175px}select{max-width:100%}.set{display:grid;grid-template-columns:32px 1fr 1fr 32px;align-items:center;gap:7px;margin:8px 0}.set input{width:100%}.sethead{font-size:12px;color:var(--muted);text-align:center}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1a2731;border-top:1px solid #43505c;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:5}.tabs button{flex:1;border:0;background:transparent;font-size:13px;padding:8px 1px}.tabs button.active{color:var(--blue);font-weight:700}.hidden{display:none!important}.rowgap{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.full{width:100%}.exercise{border-top:1px solid #43515d;padding-top:13px;margin-top:13px}.pill{display:inline-block;background:#334754;border-radius:8px;padding:5px 8px;font-size:13px}.chart{width:100%;height:230px;background:#14212b;border-radius:10px;margin-top:12px}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 5px}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.historyrow{border-top:1px solid #42505c;padding:10px 0}#toast{position:fixed;bottom:85px;left:15px;right:15px;z-index:8;background:#345d4c;padding:13px;border-radius:10px;text-align:center;display:none}svg text{font-size:11px;fill:#b6c6d2}svg polyline{fill:none;stroke:#49aeff;stroke-width:3}svg circle{fill:#49aeff}</style></head><body><header><h1>💪 Мой силовой дневник</h1><small>Программа • тренировки • прогрессия</small></header><main><section id="program"></section><section id="workout" class="hidden"></section><section id="history" class="hidden"></section><section id="progress" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs"><button data-tab="program" class="active">📋<br>План</button><button data-tab="workout">🏋️<br>Треня</button><button data-tab="history">🕒<br>История</button><button data-tab="progress">📈<br>Графики</button><button data-tab="settings">⚙️<br>Данные</button></nav><div id="toast"></div><script>
'use strict';
const KEY='my_strength_diary_v1';
const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);
const initial=()=>({days:[
{id:uid(),name:'Грудь и трицепс',exercises:[
['Брусья',5,10,0],['Жим штанги лёжа',3,8,55],['Жим гантелей на наклонной 30°',3,10,20],['Жим гантелей сидя 75–85°',3,10,16],['Разведение гантелей стоя',3,15,8],['Разгибание рук на трицепс',3,12,15],['Скручивания',3,15,0]].map(([name,sets,reps,weight])=>({id:uid(),name,sets,reps,weight}))},
{id:uid(),name:'Спина и бицепс',exercises:[
['Подтягивания',3,10,0],['Тяга верхнего блока',3,10,45],['Тяга нижнего блока',3,10,45],['Румынская тяга',3,10,60],['Подъём штанги на бицепс',3,10,30],['Молотки с гантелями',3,12,12]].map(([name,sets,reps,weight])=>({id:uid(),name,sets,reps,weight}))},
{id:uid(),name:'Ноги и плечи',exercises:[
['Приседания со штангой',4,10,70],['Выпады с гантелями',3,10,12],['Подъёмы на носки',3,15,40],['Жим гантелей сидя',3,10,16],['Махи гантелями в стороны',3,15,8],['Скручивания',3,15,0]].map(([name,sets,reps,weight])=>({id:uid(),name,sets,reps,weight}))}
],logs:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(db.days)||!Array.isArray(db.logs))throw Error()}catch{db=initial()}
let tab='program',dayId=db.days[0]?.id||null,session=null,selectedEx=null;try{session=JSON.parse(localStorage.getItem('strength_active_session')||'null')}catch{}
const saveSession=()=>{try{if(session)localStorage.setItem('strength_active_session',JSON.stringify(session));else localStorage.removeItem('strength_active_session')}catch{}};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Не удалось сохранить. Экспортируй резервную копию.')}};
const toast=s=>{const t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const findDay=id=>db.days.find(x=>x.id===id);
const latest=(name)=>{for(const log of [...db.logs].reverse()){const e=log.exercises.find(x=>x.name===name);if(e)return e}return null};
const weight=v=>Number.isFinite(+v)?+v:0;
function switchTab(t){tab=t;document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==t));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function render(){({program:renderProgram,workout:renderWorkout,history:renderHistory,progress:renderProgress,settings:renderSettings})[tab]();}
function renderProgram(){ $('program').innerHTML=`<div class="line"><h2>Моя программа</h2><button class="small primary" id="addDay">+ День</button></div>${db.days.map(d=>`<article class="card"><div class="line"><strong>${esc(d.name)}</strong><button class="small" data-editday="${d.id}">✏️</button></div>${d.exercises.map(e=>`<div class="exercise"><div class="line"><div class="grow"><div class="name">${esc(e.name)}</div><small>${e.sets} × ${e.reps} повторений</small></div><strong>${e.weight} кг</strong><button class="small" data-editex="${d.id}|${e.id}">✏️</button></div></div>`).join('')}<div class="rowgap"><button class="small" data-addex="${d.id}">+ Упражнение</button><button class="small primary" data-start="${d.id}">Начать тренировку</button></div></article>`).join('')||'<div class="empty">Добавь первый тренировочный день</div>'}`;
$('addDay').onclick=()=>{const name=prompt('Название тренировочного дня:','Новый день');if(!name?.trim())return;db.days.push({id:uid(),name:name.trim(),exercises:[]});save();render()};
document.querySelectorAll('[data-editday]').forEach(b=>b.onclick=()=>{let d=findDay(b.dataset.editday);let n=prompt('Название дня:',d.name);if(n===null)return;if(n.trim())d.name=n.trim();else if(confirm('Удалить этот день?'))db.days=db.days.filter(x=>x.id!==d.id);save();render()});
document.querySelectorAll('[data-addex]').forEach(b=>b.onclick=()=>editEx(b.dataset.addex));
document.querySelectorAll('[data-editex]').forEach(b=>b.onclick=()=>{let [d,e]=b.dataset.editex.split('|');editEx(d,e)});
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));}
function editEx(did,eid){const d=findDay(did),e=d.exercises.find(x=>x.id===eid);let name=prompt('Название упражнения:',e?.name||'');if(name===null||!name.trim())return;let sets=prompt('Количество подходов:',e?.sets??3);if(sets===null)return;let reps=prompt('Цель повторений:',e?.reps??10);if(reps===null)return;let w=prompt('Рабочий вес в кг (для упражнений с собственным весом — 0):',e?.weight??0);if(w===null)return;const obj={id:e?.id||uid(),name:name.trim(),sets:Math.min(20,Math.max(1,parseInt(sets)||1)),reps:Math.min(100,Math.max(1,parseInt(reps)||1)),weight:Math.max(0,weight(w))};if(e)Object.assign(e,obj);else d.exercises.push(obj);save();render();}
function start(id){if(session&&!confirm('Заменить незавершённую тренировку?'))return;let d=findDay(id);dayId=id;session={id:uid(),dayId:id,dayName:d.name,date:today(),exercises:d.exercises.map(e=>{let old=latest(e.name);return {id:e.id,name:e.name,sets:Array.from({length:e.sets},(_,i)=>({kg:old?.sets[i]?.kg??e.weight,reps:old?.sets[i]?.reps??e.reps,done:false}))}})};saveSession();switchTab('workout')}
function renderWorkout(){if(!session){$('workout').innerHTML=`<h2>Новая тренировка</h2><div class="card"><label>Выбери день</label><select id="daypick">${db.days.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><div class="rowgap"><button class="primary" id="begin">Начать</button></div></div>`;$('begin').onclick=()=>start($('daypick').value);return}
$('workout').innerHTML=`<h2>${esc(session.dayName)}</h2><div class="card"><label>Дата тренировки</label><input type="date" id="date" value="${session.date}"></div>${session.exercises.map((e,ei)=>`<article class="card"><h2>${esc(e.name)}</h2><div class="set"><span class="sethead">№</span><span class="sethead">Килограммы</span><span class="sethead">Повторения</span><span class="sethead">✓</span></div>${e.sets.map((s,si)=>`<div class="set"><span>${si+1}</span><input type="number" inputmode="decimal" min="0" step="0.5" data-kg="${ei}|${si}" value="${s.kg}"><input type="number" inputmode="numeric" min="0" step="1" data-reps="${ei}|${si}" value="${s.reps}"><input type="checkbox" data-done="${ei}|${si}" ${s.done?'checked':''} style="width:25px;height:25px"></div>`).join('')}<div class="rowgap"><button class="small" data-addset="${ei}">+ Подход</button><button class="small danger" data-removeset="${ei}">− Подход</button></div></article>`).join('')}<button class="good full" id="finish">✓ Сохранить тренировку</button><div class="rowgap"><button class="danger full" id="cancel">Отменить тренировку</button></div>`;
$('date').onchange=e=>{session.date=e.target.value;saveSession()};
document.querySelectorAll('[data-kg],[data-reps],[data-done]').forEach(el=>el.onchange=()=>{let kind=el.hasAttribute('data-kg')?'kg':el.hasAttribute('data-reps')?'reps':'done';let [i,j]=el.dataset[kind].split('|').map(Number);session.exercises[i].sets[j][kind]=kind==='done'?el.checked:Math.max(0,weight(el.value));saveSession()});
document.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{let e=session.exercises[+b.dataset.addset],s=e.sets.at(-1)||{kg:0,reps:10};e.sets.push({...s,done:false});saveSession();render()});
document.querySelectorAll('[data-removeset]').forEach(b=>b.onclick=()=>{let e=session.exercises[+b.dataset.removeset];if(e.sets.length>1)e.sets.pop();saveSession();render()});
$('cancel').onclick=()=>{if(confirm('Отменить незавершённую тренировку?')){session=null;saveSession();switchTab('program')}};
$('finish').onclick=()=>{if(!session.date)return alert('Выбери дату');if(!session.exercises.length)return alert('Добавь упражнения');const log=JSON.parse(JSON.stringify(session));db.logs.push(log);db.logs.sort((a,b)=>a.date.localeCompare(b.date));const day=findDay(session.dayId);if(day){for(const e of session.exercises){const target=day.exercises.find(x=>x.id===e.id);const valid=e.sets.filter(s=>s.done&&s.reps>0);if(target&&valid.length)target.weight=Math.max(...valid.map(s=>s.kg));}}save();session=null;saveSession();toast('Тренировка сохранена');switchTab('history')};}
function renderHistory(){$('history').innerHTML=`<h2>История тренировок</h2>${[...db.logs].reverse().map(l=>`<article class="card"><div class="line"><div><strong>${esc(l.dayName)}</strong><br><small>${esc(l.date)}</small></div><button class="small danger" data-del="${l.id}">Удалить</button></div>${l.exercises.map(e=>`<div class="historyrow"><strong>${esc(e.name)}</strong><br><small>${e.sets.filter(s=>s.done).map(s=>`${s.kg} кг × ${s.reps}`).join(' · ')||'Нет отмеченных подходов'}</small></div>`).join('')}</article>`).join('')||'<div class="empty">Пока нет сохранённых тренировок</div>'}`;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить запись тренировки?')){db.logs=db.logs.filter(x=>x.id!==b.dataset.del);save();render()}})}
function renderProgress(){const names=[...new Set([...db.days.flatMap(d=>d.exercises.map(e=>e.name)),...db.logs.flatMap(l=>l.exercises.map(e=>e.name))])];if(!names.length){$('progress').innerHTML='<div class="empty">Добавь упражнения</div>';return}if(!names.includes(selectedEx))selectedEx=names[0];let points=db.logs.map(l=>{let ex=l.exercises.find(e=>e.name===selectedEx);let sets=ex?.sets.filter(s=>s.done&&s.reps>0)||[];return sets.length?{date:l.date,kg:Math.max(...sets.map(s=>s.kg)),volume:sets.reduce((a,s)=>a+s.kg*s.reps,0)}:null}).filter(Boolean);let vals=points.map(p=>p.kg);let min=Math.max(0,Math.min(...vals,0)-5),max=Math.max(10,...vals)+5,range=max-min;let x=i=>points.length===1?165:40+i*250/(points.length-1),y=v=>190-(v-min)/range*150;let poly=points.map((p,i)=>`${x(i)},${y(p.kg)}`).join(' ');$('progress').innerHTML=`<h2>Прогрессия веса</h2><div class="card"><label>Упражнение</label><select id="exSelect">${names.map(n=>`<option ${n===selectedEx?'selected':''}>${esc(n)}</option>`).join('')}</select><p class="muted">Максимальный рабочий вес выполненного подхода за тренировку</p>${points.length?`<svg class="chart" viewBox="0 0 330 220" role="img" aria-label="График рабочих весов"><line x1="40" y1="190" x2="305" y2="190" stroke="#6b7d8b"/><line x1="40" y1="30" x2="40" y2="190" stroke="#6b7d8b"/><text x="5" y="32">${max} кг</text><text x="5" y="190">${min} кг</text><polyline points="${poly}"/>${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.kg)}" r="4"/>`).join('')}<text x="42" y="211">${esc(points[0].date)}</text><text x="226" y="211">${esc(points.at(-1).date)}</text></svg><div class="line"><span class="pill">Первый: ${vals[0]} кг</span><span class="pill">Последний: ${vals.at(-1)} кг</span></div><p><strong>Изменение: ${+(vals.at(-1)-vals[0]).toFixed(2)} кг</strong></p><div>${points.map(p=>`<div class="historyrow">${esc(p.date)} — <strong>${p.kg} кг</strong> · объём ${Math.round(p.volume)} кг</div>`).join('')}</div>`:'<div class="empty">Сохрани тренировку с отмеченными подходами, чтобы увидеть график</div>'}</div>`;$('exSelect').onchange=e=>{selectedEx=e.target.value;render()};}
function renderSettings(){$('settings').innerHTML=`<h2>Данные и резервные копии</h2><div class="card"><p>Все записи хранятся локально в браузере на этом устройстве. Без сервера и аккаунта.</p><button class="primary full" id="export">⬇ Экспортировать копию (.json)</button><label>Восстановить резервную копию</label><input type="file" id="import" accept=".json,application/json" style="width:100%"><p class="muted">Важно: при очистке данных браузера история может исчезнуть. Регулярно сохраняй копию в «Файлы» или iCloud Drive.</p></div><div class="card"><button class="danger full" id="wipe">Удалить все данные</button></div>`;$('export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`силовой-дневник-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.days)||!Array.isArray(obj.logs))throw Error();if(!confirm('Заменить текущие данные содержимым резервной копии?'))return;db=obj;save();session=null;toast('Копия восстановлена');switchTab('program')}catch{alert('Неверный файл резервной копии')}};$('wipe').onclick=()=>{if(confirm('Точно удалить все дни, упражнения и историю?')&&confirm('Это действие нельзя отменить без резервной копии. Продолжить?')){db=initial();session=null;save();switchTab('program')}};}
save();render();
</script></body></html>
